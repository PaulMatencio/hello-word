version: '3.8'
services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-json
    ports:
      - "6379:6379" # Redis port
      - "8001:8001" # RedisInsight UI
    restart: unless-stopped
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly yes
    command: redis-server --requirepass ${REDIS_PASSWORD:-} # Optional password

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
